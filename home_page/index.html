<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Robust</title>
</head>

<body>
    <canvas class="orb-canvas" id="orbCanvas" aria-hidden="true"></canvas>
    <div class="cinematic-vignette" aria-hidden="true"></div>

    <main class="home">
        <section class="hero" aria-label="Robust home">
            <div class="brand">
                <h1 class="brand__title">Robust</h1>
            </div>

            <form class="search" autocomplete="off">
                <div class="search__glass">
                    <div class="search__icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" focusable="false">
                            <path d="M10.75 18.5a7.75 7.75 0 1 1 5.08-1.9l3.28 3.28a.78.78 0 0 1-1.1 1.1l-3.28-3.28a7.72 7.72 0 0 1-3.98.8Zm0-1.55a6.2 6.2 0 1 0 0-12.4 6.2 6.2 0 0 0 0 12.4Z" />
                        </svg>
                    </div>

                    <input
                        class="search__input"
                        id="searchInput"
                        type="text"
                        name="q"
                        spellcheck="false"
                        autocomplete="off"
                        placeholder="Search or enter address"
                        autofocus
                    >

                    <div class="engine" id="enginePicker">
                        <button class="engine__button" id="engineButton" type="button" aria-haspopup="listbox" aria-expanded="false">
                            <span class="engine__logo" id="engineLogo" aria-hidden="true"></span>
                            <span class="engine__label" id="engineLabel">Google</span>
                            <svg class="engine__chevron" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                                <path d="M5.6 7.6 10 12l4.4-4.4" />
                            </svg>
                        </button>

                        <div class="engine__menu" id="engineMenu" role="listbox" aria-label="Search engine">
                            <button class="engine__option is-selected" type="button" role="option" aria-selected="true" data-engine="google">
                                <span class="engine__logo engine__logo--google" aria-hidden="true">
                                    <svg viewBox="0 0 24 24" focusable="false">
                                        <path fill="#4285f4" d="M22.6 12.24c0-.78-.07-1.52-.2-2.24H12v4.26h5.94a5.1 5.1 0 0 1-2.2 3.34v2.77h3.56c2.08-1.92 3.3-4.74 3.3-8.13Z" />
                                        <path fill="#34a853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.56-2.77c-.98.66-2.24 1.06-3.72 1.06-2.86 0-5.29-1.93-6.16-4.53H2.17v2.85A11 11 0 0 0 12 23Z" />
                                        <path fill="#fbbc05" d="M5.84 14.1A6.6 6.6 0 0 1 5.5 12c0-.73.12-1.44.34-2.1V7.05H2.17A11 11 0 0 0 1 12c0 1.78.43 3.46 1.17 4.95l3.67-2.85Z" />
                                        <path fill="#ea4335" d="M12 5.38c1.62 0 3.07.56 4.21 1.65l3.15-3.15C17.45 2.1 14.97 1 12 1A11 11 0 0 0 2.17 7.05L5.84 9.9c.87-2.6 3.3-4.52 6.16-4.52Z" />
                                    </svg>
                                </span>
                                <span>Google</span>
                            </button>
                            <button class="engine__option" type="button" role="option" aria-selected="false" data-engine="duckduckgo">
                                <span class="engine__logo engine__logo--duckduckgo" aria-hidden="true">
                                    <svg viewBox="0 0 24 24" focusable="false">
                                        <circle cx="12" cy="12" r="10.5" fill="#de5833" />
                                        <circle cx="12" cy="11" r="6.2" fill="#fff" />
                                        <path fill="#f4b43f" d="M7.1 15.5c2.9 1.6 6.9 1.6 9.8 0-.8 2.3-2.6 3.7-4.9 3.7s-4.1-1.4-4.9-3.7Z" />
                                        <path fill="#7b3a16" d="M9.4 10.8a1.1 1.1 0 1 0 0-2.2 1.1 1.1 0 0 0 0 2.2Zm5.2 0a1.1 1.1 0 1 0 0-2.2 1.1 1.1 0 0 0 0 2.2Z" />
                                        <path fill="#ffce6a" d="M10.1 12.3h3.8l-1.9 2.2Z" />
                                    </svg>
                                </span>
                                <span>DuckDuckGo</span>
                            </button>
                            <button class="engine__option" type="button" role="option" aria-selected="false" data-engine="brave">
                                <span class="engine__logo engine__logo--brave" aria-hidden="true">
                                    <svg viewBox="0 0 24 24" focusable="false">
                                        <path fill="#fb542b" d="M12 1.4 19.1 4l2 6.8-3.2 8.1L12 22.6l-5.9-3.7-3.2-8.1L4.9 4Z" />
                                        <path fill="#fff" d="m7.2 8.2 2.5-1 2.3 2.2 2.3-2.2 2.5 1-.7 6.2-4.1 3.1-4.1-3.1Zm3 6.4 1.8 1.3 1.8-1.3-1.8-.8Z" opacity=".95" />
                                    </svg>
                                </span>
                                <span>Brave Search</span>
                            </button>
                            <button class="engine__option" type="button" role="option" aria-selected="false" data-engine="bing">
                                <span class="engine__logo engine__logo--bing" aria-hidden="true">
                                    <svg viewBox="0 0 24 24" focusable="false">
                                        <path fill="#00a4ef" d="M6 2.6 11.4 4v11.1l4.2 2.4-9.6 3.9Z" />
                                        <path fill="#7fba00" d="m11.4 9.4 6.6 3.8v4.8l-6.6-2.9Z" />
                                        <path fill="#008ad7" d="m6 21.4 5.4-6.3 6.6 2.9Z" />
                                    </svg>
                                </span>
                                <span>Bing</span>
                            </button>
                            <button class="engine__option" type="button" role="option" aria-selected="false" data-engine="yandex">
                                <span class="engine__logo engine__logo--yandex" aria-hidden="true">
                                    <svg viewBox="0 0 24 24" focusable="false">
                                        <circle cx="12" cy="12" r="10" fill="#fff" />
                                        <path fill="#fc3f1d" d="M13.7 20h-2.5v-6.3L7.8 4h2.8l2 6.6L15.8 4h2.7l-4.8 9.6Z" />
                                    </svg>
                                </span>
                                <span>Yandex</span>
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </section>
    </main>

    <script src="index.js"></script>
</body>

</html>
